name: run-scenario-suite

# Manual trigger only — every run makes real, billed phone calls to the target.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenario files to run (space-separated), or blank for all"
        default: ""

concurrency:
  group: patient-calls        # never overlap with the tuner (they share one target)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      TARGET_AGENT_NUMBER: ${{ secrets.TARGET_AGENT_NUMBER }}
      STREAM_SECRET: ${{ secrets.STREAM_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --quiet --upgrade pip
          ./.venv/bin/python -m pip install --quiet -r requirements.txt

      - name: Install cloudflared
        run: |
          curl -sSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

      - name: Start tunnel and server
        run: |
          nohup cloudflared tunnel --url http://localhost:5050 > cf.log 2>&1 &
          for i in $(seq 1 20); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1) && [ -n "$URL" ] && break
            sleep 1
          done
          [ -z "$URL" ] && { echo "no tunnel url"; cat cf.log; exit 1; }
          HOST=${URL#https://}
          echo "PUBLIC_BASE_URL=$HOST" >> "$GITHUB_ENV"
          PUBLIC_BASE_URL="$HOST" nohup ./.venv/bin/python -m uvicorn server:app \
            --app-dir src --host 0.0.0.0 --port 5050 > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf "https://$HOST/health" >/dev/null && { echo "healthy"; break; }
            sleep 1
          done
          curl -sf "https://$HOST/health" || { echo "unhealthy"; cat server.log cf.log; exit 1; }

      - name: Run scenario suite
        run: ./.venv/bin/python src/runner.py ${{ github.event.inputs.scenarios }}

      - name: Server log tail
        if: always()
        run: tail -n 60 server.log || true

      - name: Upload findings, recordings, transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ github.run_id }}
          path: |
            FINDINGS.md
            artifacts/**/findings.json
            artifacts/**/recording.wav
            artifacts/**/transcript.json
          retention-days: 90
